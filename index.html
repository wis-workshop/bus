<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waimea Intermediate Daily Bus Boarding</title>
<style>
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#0f172a;color:#fff}.header{padding:20px;background:#1e293b;position:sticky;top:0;z-index:10}h1{margin:0 0 10px}.input{width:100%;padding:16px;font-size:22px;border-radius:12px;border:none;box-sizing:border-box}.controls{margin-top:10px;display:flex;flex-wrap:wrap;gap:10px}button{border:none;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.red{background:#dc2626;color:#fff}.green{background:#16a34a;color:#fff}.blue{background:#2563eb;color:#fff}.orange{background:#ea580c;color:#fff}.stats{display:flex;gap:20px;flex-wrap:wrap;margin-top:10px}.grid{padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px}.bus{border-radius:18px;padding:12px;box-shadow:0 4px 12px rgba(0,0,0,.3)}.destination{background:rgba(255,255,255,.2);padding:8px;border-radius:8px;margin-bottom:10px;font-weight:bold;min-height:42px}.student{background:rgba(255,255,255,.15);margin:6px 0;padding:8px;border-radius:10px}#status{font-weight:bold;margin-top:8px}.clock{float:right}@media print {.header button,.input{display:none}}
</style>
</head>
<body>
<div class="header"><h1>🚌 Waimea Intermediate Daily Bus Boarding <span class="clock" id="clock"></span></h1><input id="scan" class="input" placeholder="Ready for QR scanning..." autocomplete="off"><div id="status">Ready for scanning...</div><div class="stats"><div>Total Students: <span id="total">0</span></div><div>Last Scan: <span id="last">None</span></div></div><div class="controls"><button class="red" onclick="resetData()">Reset All</button><button class="green" onclick="exportCSV()">Export CSV</button><button class="blue" onclick="exportExcel()">Export Excel-Compatible</button><button class="orange" onclick="window.print()">Print Lists</button></div></div><div class="grid" id="grid"></div><script>const buses={"403":"Pigeon Valley","404":"Wairoa - Lee","423":"Aniseed Valley","424":"Redwood Vly - Best Is","425":"Wakefield Village Hall","426":"Ranzau - Landsdowne","427":"Waimea West","428":"Wakefield Pitfure Rd - Brightwater","429":"Hiwipango & Hope","432":"88 Valley","434":"Belgrove","436":"Brightwater"};const colors=['#2563eb','#16a34a','#ea580c','#9333ea','#0d9488','#dc2626','#4f46e5','#d97706','#0891b2','#db2777','#65a30d','#475569'];let records=JSON.parse(localStorage.getItem('busRecords')||'[]');const scanned={};const grid=document.getElementById('grid');const scan=document.getElementById('scan');const status=document.getElementById('status');function build(){grid.innerHTML='';Object.entries(buses).forEach(([busId,destination],index)=>{const card=document.createElement('div');card.className='bus';card.style.background=colors[index%colors.length];card.innerHTML=`<h2>${busId} (<span id="count-${busId}">0</span>)</h2><div class="destination">${destination}</div><div id="bus-${busId}"></div>`;grid.appendChild(card);});records.forEach(addVisual);updateCounts();}function addVisual(record){scanned[record.name+record.bus]=record.time;const box=document.getElementById('bus-'+record.bus);if(!box)return;const div=document.createElement('div');div.className='student';div.innerHTML=`<b>${record.name}</b><br>${record.time}`;box.prepend(div);}function save(){localStorage.setItem('busRecords',JSON.stringify(records));}function updateCounts(){document.getElementById('total').textContent=records.length;Object.keys(buses).forEach(bus=>{const count=document.getElementById('bus-'+bus).children.length;document.getElementById('count-'+bus).textContent=count;});}scan.addEventListener('keydown',event=>{if(event.key!=='Enter')return;let value=scan.value.trim();scan.value='';const bus=value.slice(-3);const name=value.slice(0,-3).trim();if(!buses[bus]){status.textContent='❌ Invalid bus number';return;}if(scanned[name+bus]){status.textContent='⚠ Duplicate scan';return;}const record={name,bus,time:new Date().toLocaleString()};records.push(record);save();addVisual(record);updateCounts();document.getElementById('last').textContent=`${name} → ${bus}`;status.textContent=`✅ ${name} boarded Bus ${bus}`;});function resetData(){if(confirm('Remove all scans?')){localStorage.removeItem('busRecords');location.reload();}}function exportCSV(){let csv='Name,Bus,Time\n';records.forEach(r=>csv+=`"${r.name}",${r.bus},"${r.time}"\n`);download(csv,'BusBoardingExport.csv','text/csv');}function exportExcel(){let csv='Name,Bus,Time\n';records.forEach(r=>csv+=`${r.name},${r.bus},${r.time}\n`);download(csv,'BusBoardingExport.xls','application/vnd.ms-excel');}function download(data,file,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:type}));a.download=file;a.click();}setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString();scan.focus();},500);build();</script></body></html>
